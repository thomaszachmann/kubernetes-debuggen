apiVersion: v1
kind: Pod
metadata:
  name: gut
  namespace: dbg-11
  labels:
    app: gut
    team: plattform
spec:
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged:1.29-alpine
      resources:
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: ohne-team
  namespace: dbg-11
  labels:
    app: ohne-team
spec:
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged:1.29-alpine
      resources:
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: ohne-limit
  namespace: dbg-11
  labels:
    app: ohne-limit
    team: plattform
spec:
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged:1.29-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: legacy-batch
  namespace: dbg-11
  labels:
    app: legacy-batch
    team: batch
spec:
  containers:
    - name: job
      image: busybox:1.37
      command: ["sleep", "infinity"]
