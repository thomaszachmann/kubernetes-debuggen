apiVersion: v1
kind: Namespace
metadata:
  name: dbg-06
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webro
  namespace: dbg-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webro
  template:
    metadata:
      labels:
        app: webro
    spec:
      containers:
        - name: web
          image: nginx:1.29
          ports:
            - containerPort: 80
          securityContext:
            readOnlyRootFilesystem: true
