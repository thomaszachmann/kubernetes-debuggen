apiVersion: apps/v1
kind: Deployment
metadata:
  name: tippfehler
  namespace: dbg-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tippfehler
  template:
    metadata:
      labels:
        app: tippfehler
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && exec httpd -f -p 8080 -h /www"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appfehler
  namespace: dbg-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appfehler
  template:
    metadata:
      labels:
        app: appfehler
    spec:
      containers:
        - name: app
          image: busybox:1.37
          env:
            - name: DATABASE_URL
              value: postgres://db.dbg-06.svc.cluster.local:5432/app
          command:
            - sh
            - -c
            - |
              echo "Konfiguration wird geladen"
              if [ -z "$DATABASE_URL" ]; then
                echo "FEHLER: DATABASE_URL ist nicht gesetzt" >&2
                exit 1
              fi
              exec sleep infinity
