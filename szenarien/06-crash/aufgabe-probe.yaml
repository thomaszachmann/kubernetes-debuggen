apiVersion: v1
kind: Namespace
metadata:
  name: dbg-06
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waechter
  namespace: dbg-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waechter
  template:
    metadata:
      labels:
        app: waechter
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 3
