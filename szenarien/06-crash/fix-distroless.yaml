apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-test
  namespace: dbg-06
data:
  Corefile: |
    .:1053 {
        whoami
        health :8080
        log
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-test
  namespace: dbg-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-test
  template:
    metadata:
      labels:
        app: dns-test
    spec:
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.7
          args: ["-conf", "/etc/coredns/Corefile"]
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
      volumes:
        - name: config
          configMap:
            name: dns-test
