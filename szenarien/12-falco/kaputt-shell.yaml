# Kapitel 12, Szenario 2: Ein Pod, in dem gleich jemand eine Shell öffnet.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dbg-12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.37
          command: ["sh", "-c", "while true; do sleep 3600; done"]
