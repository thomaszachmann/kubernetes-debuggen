# Kapitel 12, Szenario 3: Legitimer Aufräum-Job, der mit kubectl die
# Kubernetes-API anspricht. Löst "Contact K8S API Server From Container" aus.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-12
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aufraeumer
  namespace: dbg-12
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aufraeumer
  namespace: dbg-12
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aufraeumer
  namespace: dbg-12
subjects:
  - kind: ServiceAccount
    name: aufraeumer
    namespace: dbg-12
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aufraeumer
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aufraeumer
  namespace: dbg-12
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: aufraeumer
          restartPolicy: Never
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.6
              args:
                - delete
                - pods
                - -n
                - dbg-12
                - --field-selector=status.phase==Succeeded
