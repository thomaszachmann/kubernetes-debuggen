# Kapitel 9, Szenario 3: zwei Replikas, ein RWO-Volume, verschiedene Knoten.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-09
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
  namespace: dbg-09
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: dbg-09
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      affinity:
        podAntiAffinity:         # jede Replika auf einen anderen Knoten
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: cache
      containers:
        - name: cache
          image: busybox:1.37
          command: ["sh", "-c", "hostname >> /data/wer-war-hier && sleep infinity"]
          volumeMounts:
            - name: daten
              mountPath: /data
      volumes:
        - name: daten
          persistentVolumeClaim:
            claimName: cache     # FEHLER: beide Replikas teilen ein RWO-Volume
