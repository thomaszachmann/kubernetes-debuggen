# Kapitel 9, Szenario 2: einfacher PVC-Test (Talos ohne privileged-Label am Provisioner).
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-09
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: probe
  namespace: dbg-09
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: dbg-09
spec:
  containers:
    - name: probe
      image: busybox:1.37
      command: ["sh", "-c", "echo ok > /data/ok && sleep infinity"]
      volumeMounts:
        - name: daten
          mountPath: /data
  volumes:
    - name: daten
      persistentVolumeClaim:
        claimName: probe
