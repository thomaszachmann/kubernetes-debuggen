# Kapitel 14, Szenario abgelaufenes Client-Zertifikat.
# Der Benutzer dbg14-user darf im Namespace dbg-14 lesen (ClusterRole view).
# Sein Zertifikat erzeugt kurzlebiges-zertifikat.sh mit 10 Minuten Laufzeit.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-14
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hallo
  namespace: dbg-14
data:
  gruss: "Hallo aus dbg-14"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbg14-user-view
  namespace: dbg-14
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: dbg14-user
