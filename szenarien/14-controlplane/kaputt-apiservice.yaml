# Kapitel 14, Szenario Namespace bleibt Terminating.
# Eine APIService meldet die Gruppe debug.dbg14.example.com an, deren
# Backend-Service im Namespace dbg-14 liegt und keine Pods hat.
# Dazu eine ConfigMap mit einem Finalizer, den kein Controller entfernt.
# Achtung: Solange die APIService kaputt ist, ist die Discovery des ganzen
# Clusters unvollständig. Szenario am Ende unbedingt aufräumen.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-14
---
apiVersion: v1
kind: Service
metadata:
  name: debug-api
  namespace: dbg-14
spec:
  selector:
    app: debug-api-gibt-es-nicht
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.debug.dbg14.example.com
spec:
  group: debug.dbg14.example.com
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  insecureSkipTLSVerify: true
  service:
    name: debug-api
    namespace: dbg-14
    port: 443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: festgehalten
  namespace: dbg-14
  finalizers:
    - dbg14.example.com/aufraeumen
data:
  hinweis: "Diesen Finalizer entfernt kein Controller."
