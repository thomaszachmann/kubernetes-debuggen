# Kapitel 11, Szenario 3 (Fix): Image, das ohne root auskommt (UID 101, Port 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: dbg-11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
        team: shop
    spec:
      containers:
        - name: shop
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 128Mi
