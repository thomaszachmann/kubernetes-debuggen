apiVersion: v1
kind: Namespace
metadata:
  name: dbg-04
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dbg-quota
  namespace: dbg-04
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dbg-04
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.29
          ports:
            - containerPort: 80
