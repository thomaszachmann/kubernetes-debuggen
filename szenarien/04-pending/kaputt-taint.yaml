apiVersion: v1
kind: Namespace
metadata:
  name: dbg-04
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: dbg-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      nodeSelector:
        dbg-pool: batch
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
