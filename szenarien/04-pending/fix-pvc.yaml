apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daten
  namespace: dbg-04
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datenbank
  namespace: dbg-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datenbank
  template:
    metadata:
      labels:
        app: datenbank
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "date >> /daten/start.log; sleep infinity"]
          volumeMounts:
            - name: daten
              mountPath: /daten
      volumes:
        - name: daten
          persistentVolumeClaim:
            claimName: daten
