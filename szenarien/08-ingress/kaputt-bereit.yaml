# Kapitel 8, Szenario 3: Kein Pod wird ready, der Service bleibt leer.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-08
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: dbg-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 8080         # FEHLER: whoami lauscht auf Port 80
            periodSeconds: 5
