# Kapitel 8, Szenario 2: Ingress nennt einen Port, den der Service nicht hat.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-08
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: dbg-08
spec:
  ingressClassName: traefik
  rules:
    - host: shop.dbg08.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 8080   # FEHLER: der Service hat nur Port 80
