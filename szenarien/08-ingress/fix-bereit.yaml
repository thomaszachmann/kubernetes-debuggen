# Kapitel 8, Szenario 3: Readiness-Probe auf den richtigen Port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: dbg-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
