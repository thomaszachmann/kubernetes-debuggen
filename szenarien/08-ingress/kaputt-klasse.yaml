# Kapitel 8, Szenario 1: Ingress mit der falschen IngressClass.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-08
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: dbg-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: dbg-08
spec:
  selector:
    app: shop
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: dbg-08
spec:
  ingressClassName: nginx     # FEHLER: aus einer alten Anleitung kopiert
  rules:
    - host: shop.dbg08.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
