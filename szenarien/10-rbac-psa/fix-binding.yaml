# Kapitel 10, Szenario 1 (Fix): RoleBinding im selben Namespace wie
# Role und ServiceAccount. Die falsche Binding in "default" vorher löschen:
#   kubectl --context rke2 delete rolebinding pod-reader -n default
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: dbg-10
subjects:
  - kind: ServiceAccount
    name: app
    namespace: dbg-10
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
