# Kapitel 10, Szenario 3: hostPath-Volume.
# Läuft auf RKE2 (ohne CIS-Profil kein PSA-Standard), scheitert auf
# Talos (cluster-weit enforce: baseline).
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-10
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-sammler
  namespace: dbg-10
spec:
  selector:
    matchLabels:
      app: log-sammler
  template:
    metadata:
      labels:
        app: log-sammler
    spec:
      containers:
        - name: sammler
          image: busybox:1.37
          command: ["sh", "-c", "while true; do ls /host/var/log | wc -l; sleep 60; done"]
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
