# Kapitel 10, Aufgabe: Ein Job soll ConfigMaps in dbg-10 lesen.
# Er scheitert. Finde heraus, warum, ohne die Lösung im Buch zu lesen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cm-reader
  namespace: dbg-10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cm-reader
  namespace: dbg-10
rules:
  - apiGroups: ["apps"]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cm-reader
  namespace: dbg-10
subjects:
  - kind: ServiceAccount
    name: cm-reader
    namespace: dbg-10
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cm-reader
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cm-reader
  namespace: dbg-10
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: cm-reader
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.36.6
          args: ["get", "configmaps", "-n", "dbg-10"]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
