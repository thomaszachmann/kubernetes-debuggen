# Kapitel 10, Szenario 1: RoleBinding im falschen Namespace.
# Der Pod "pod-lister" listet mit kubectl die Pods in dbg-10 und
# scheitert mit Forbidden, weil die RoleBinding in "default" liegt.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: dbg-10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dbg-10
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: default        # Fehler: kopiert, Namespace nicht angepasst
subjects:
  - kind: ServiceAccount
    name: app
    namespace: dbg-10
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-lister
  namespace: dbg-10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-lister
  template:
    metadata:
      labels:
        app: pod-lister
    spec:
      serviceAccountName: app
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.36.6
          args: ["get", "pods", "-n", "dbg-10", "--watch"]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
