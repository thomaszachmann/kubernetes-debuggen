apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dbg-05
data:
  DB_HOST: db.dbg-05.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: dbg-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "echo \"Verbinde mit $DB_HOST\"; sleep infinity"]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-password
