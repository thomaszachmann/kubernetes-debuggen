apiVersion: v1
kind: Namespace
metadata:
  name: dbg-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline
  namespace: dbg-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offline
  template:
    metadata:
      labels:
        app: offline
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine-slim
          imagePullPolicy: Never
