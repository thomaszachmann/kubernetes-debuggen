apiVersion: apps/v1
kind: Deployment
metadata:
  name: tippfehler
  namespace: dbg-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tippfehler
  template:
    metadata:
      labels:
        app: tippfehler
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
