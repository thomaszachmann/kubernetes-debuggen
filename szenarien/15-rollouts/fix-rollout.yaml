# Kapitel 15, Fix für Szenario Rollout: v2 mit passender Readiness-Probe.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dbg-15
  annotations:
    kubernetes.io/change-cause: "v2: httpd auf 8081, Probe korrigiert"
spec:
  replicas: 3
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        version: "v2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: busybox:1.37
          command: ["httpd", "-f", "-p", "8081", "-h", "/tmp"]
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
