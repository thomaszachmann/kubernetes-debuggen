# Kapitel 13, Fix für Szenario Eviction: Limit passend zum Bedarf (200 MiB
# Daten plus Logs) und eine Obergrenze direkt am emptyDir.
apiVersion: v1
kind: Namespace
metadata:
  name: dbg-13
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fueller
  namespace: dbg-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fueller
  template:
    metadata:
      labels:
        app: fueller
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fueller
          image: busybox:1.37
          command:
            - sh
            - -c
            - dd if=/dev/zero of=/daten/block bs=1M count=200 && sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: daten
              mountPath: /daten
      volumes:
        - name: daten
          emptyDir:
            sizeLimit: 250Mi
